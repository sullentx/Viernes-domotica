<div class="security-status-container">
  <!-- Resumen del estado de seguridad -->
  <div class="security-status-card" [ngClass]="securityLevel">
    <div class="status-icon">
      <mat-icon>{{ getStatusIcon() }}</mat-icon>
    </div>
    <div class="status-info">
      <h3>{{ getStatusMessage() }}</h3>
      <p>Actualizado: {{ lastUpdate | date:'shortTime' }}</p>
    </div>
  </div>
  
  <!-- Contadores de incidencias y sensores -->
  <div class="status-metrics">
    <div class="metric-card incidents">
      <div class="metric-value" [ngClass]="incidentsClass">{{ totalIncidents }}</div>
      <div class="metric-label">Incidencias</div>
    </div>
    
    <div class="metric-card sensors">
      <div class="metric-value">{{ activeSensors }}</div>
      <div class="metric-label">Sensores activos</div>
    </div>
  </div>
</div>
