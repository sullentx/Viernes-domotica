<div class="weather-container">
    <!-- Temperatura - Lado izquierdo -->
    <div class="weather-item temperature">
      <div class="value">24°C</div>
      <div class="label">Temperatura</div>
    </div>
    
    <!-- Icono y descripción - Centro -->
    <div class="weather-item weather-status">
      <div class="icon">
        <img src="https://www.metaweather.com/static/img/weather/c.svg" alt="Clima">
      </div>
      <div class="label">Caluroso</div>
    </div>
    
    <!-- Humedad - Lado derecho -->
    <div class="weather-item humidity">
      <div class="value">80%</div>
      <div class="label">Humedad</div>
    </div>
  </div>
